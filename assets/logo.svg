<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1340"/>
      <stop offset="0.55" stop-color="#3b1d6e"/>
      <stop offset="1" stop-color="#0e3a5c"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b1a"/>
      <stop offset="1" stop-color="#16162e"/>
    </linearGradient>
    <linearGradient id="jf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aa5cc3"/>
      <stop offset="1" stop-color="#00a4dc"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aa5cc3" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00a4dc" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="640" cy="80" r="160" fill="#00a4dc" opacity="0.12" filter="url(#glow)"/>
  <circle cx="140" cy="400" r="180" fill="#aa5cc3" opacity="0.14" filter="url(#glow)"/>

  <!-- screen -->
  <rect x="150" y="62" width="500" height="250" rx="22" fill="url(#jf)"/>
  <rect x="158" y="70" width="484" height="234" rx="16" fill="url(#screen)"/>

  <!-- episode grid: three seasons, a few episodes missing -->
  <g font-family="Segoe UI, Noto Sans, sans-serif" font-size="15" font-weight="700" fill="#ffffff" opacity="0.55">
    <text x="190" y="117">S1</text>
    <text x="190" y="180">S2</text>
    <text x="190" y="243">S3</text>
  </g>
  <g fill="url(#tile)">
    <rect x="226" y="96" width="62" height="34" rx="7"/>
    <rect x="300" y="96" width="62" height="34" rx="7"/>
    <rect x="374" y="96" width="62" height="34" rx="7"/>
    <rect x="448" y="96" width="62" height="34" rx="7"/>
    <rect x="522" y="96" width="62" height="34" rx="7"/>

    <rect x="226" y="159" width="62" height="34" rx="7"/>
    <rect x="300" y="159" width="62" height="34" rx="7"/>
    <rect x="448" y="159" width="62" height="34" rx="7"/>
    <rect x="522" y="159" width="62" height="34" rx="7"/>

    <rect x="226" y="222" width="62" height="34" rx="7"/>
    <rect x="300" y="222" width="62" height="34" rx="7"/>
  </g>
  <!-- missing tiles -->
  <g fill="none" stroke="#ffd34d" stroke-width="3" stroke-dasharray="7 6">
    <rect x="375.5" y="160.5" width="59" height="31" rx="6"/>
    <rect x="449.5" y="223.5" width="59" height="31" rx="6"/>
    <rect x="523.5" y="223.5" width="59" height="31" rx="6"/>
    <rect x="375.5" y="223.5" width="59" height="31" rx="6"/>
  </g>
  <g font-family="Segoe UI, Noto Sans, sans-serif" font-size="22" font-weight="800" fill="#ffd34d" text-anchor="middle">
    <text x="405" y="184">?</text>
    <text x="405" y="247">?</text>
    <text x="479" y="247">?</text>
    <text x="553" y="247">?</text>
  </g>

  <!-- NEW badge -->
  <g transform="translate(560 40)">
    <rect width="124" height="46" rx="23" fill="#ffd34d"/>
    <text x="62" y="31" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif" font-size="22" font-weight="800" letter-spacing="2" fill="#1a1340">NEW</text>
  </g>

  <!-- wordmark -->
  <text x="400" y="380" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif" font-size="48" font-weight="700" fill="#ffffff">Completionist</text>
  <text x="400" y="416" text-anchor="middle" font-family="Segoe UI, Noto Sans, sans-serif" font-size="20" fill="#c9c3e6" letter-spacing="1">every episode · every sequel</text>
</svg>
